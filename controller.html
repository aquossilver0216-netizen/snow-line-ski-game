<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#18282e"><title>SNOW LINE — Controller</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Helvetica Neue","Hiragino Sans","Yu Gothic",sans-serif;background:#18282e;color:#f2f7f8}body{min-height:100svh;display:grid;place-items:center;padding:22px;touch-action:manipulation}main{width:min(520px,100%);text-align:center}h1{font-size:14px;letter-spacing:.28em;font-weight:500;margin:0 0 10px}h2{font-size:clamp(28px,8vw,42px);font-weight:300;margin:0 0 12px;letter-spacing:-.04em}p{font-size:13px;line-height:1.8;color:#c6d7dc}.status{min-height:24px;font-size:12px;color:#f5c49f;margin:16px 0}button{font:inherit;color:#19313a;background:#f5b58d;border:0;border-radius:5px;padding:15px 20px;font-size:14px;font-weight:600;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}#enable{width:100%;margin:12px 0}.pad{display:flex;gap:14px;margin-top:22px}.pad button{flex:1;min-height:150px;font-size:34px;background:#264650;color:#fff;border:1px solid #ffffff35;touch-action:none}.pad button.active{background:#d99469}.hint{font-size:11px;color:#9db4bd;margin-top:16px}.meter{height:5px;background:#29434c;border-radius:5px;overflow:hidden;margin:22px 0}.meter span{display:block;width:50%;height:100%;background:#f5b58d;transition:transform .06s linear}
</style></head><body><main><h1>SNOW LINE</h1><h2>TURN<br>CONTROLLER</h2><p>スマートフォンを胸の前で持ち、左右に傾けてPC画面のスキーヤーを操作します。安全な場所で立ったまま使ってください。</p><div id="status" class="status" role="status">PCとの接続を待っています</div><button id="enable" type="button">接続して傾きセンサーを許可</button><div class="meter" aria-hidden="true"><span id="meter"></span></div><div class="pad"><button id="left" type="button" aria-label="左ターン">←</button><button id="right" type="button" aria-label="右ターン">→</button></div><p class="hint">センサーが使えない場合は左右ボタンを押し続けて操作できます。中央なら直進します。</p></main>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><script>
(()=>{'use strict';const status=document.getElementById('status'),enable=document.getElementById('enable'),meter=document.getElementById('meter'),hostId=new URLSearchParams(location.search).get('peer');let peer=null,connection=null,enabled=false,calibrated=false,orientation='',zero=0,steer=0,buttonSteer=0;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),setStatus=s=>status.textContent=s;
function send(){if(connection&&connection.open)try{connection.send({type:'steer',value:clamp(steer+buttonSteer,-1,1)});}catch{}}
function connect(){if(!hostId){setStatus('接続先情報がありません。PCのQRを読み直してください');enable.disabled=false;return;}if(!window.Peer){setStatus('通信機能を読み込めません');enable.disabled=false;return;}try{peer=new Peer();peer.on('open',()=>{connection=peer.connect(hostId,{reliable:true});connection.on('open',()=>setStatus('接続中 — ゆっくり傾けてください'));connection.on('close',()=>setStatus('切断されました。PCのQRから再接続してください'));connection.on('error',()=>setStatus('通信エラー。PC側の接続状態を確認してください'));});peer.on('error',()=>setStatus('PCに接続できません。PC側の接続待ちを確認してください'));}catch{setStatus('接続を開始できませんでした');}}
function orientationHandler(e){const sa=Number(screen.orientation?.angle),legacy=Number(window.orientation),quarter=a=>a===90||a===270,angle=quarter(sa)?sa:quarter(legacy)?legacy:(innerWidth>innerHeight?90:0),landscape=angle===90||angle===270,mode=landscape?(angle===270?'landscape-270':'landscape-90'):'portrait';if(mode!==orientation){orientation=mode;calibrated=false;}const axis=landscape?Number(e.beta):Number(e.gamma);if(!Number.isFinite(axis))return;const raw=landscape&&angle===270?-axis:axis;if(enabled){if(!calibrated){zero=raw;calibrated=true;steer=0;setStatus(connection?.open?'接続中 — 中央で基準設定済み':'PCとの接続を待っています');}else steer=clamp((raw-zero)/22,-1,1);}meter.style.transform='translateX('+((steer+1)*50-50)+'%)';}
async function start(){enable.disabled=true;if(typeof DeviceOrientationEvent!=='undefined'){try{if(typeof DeviceOrientationEvent.requestPermission==='function'&&await DeviceOrientationEvent.requestPermission()!=='granted')throw Error('permission');enabled=true;window.addEventListener('deviceorientation',orientationHandler,{passive:true});}catch{setStatus('センサーを許可できません。左右ボタンは利用できます');}}else setStatus('センサー非対応。左右ボタンで操作できます');connect();}
enable.addEventListener('click',start);function bind(button,value){const down=e=>{e.preventDefault();button.setPointerCapture?.(e.pointerId);buttonSteer=value;button.classList.add('active');},up=()=>{buttonSteer=0;button.classList.remove('active');};button.addEventListener('pointerdown',down);button.addEventListener('pointerup',up);button.addEventListener('pointercancel',up);button.addEventListener('lostpointercapture',up);}bind(document.getElementById('left'),-1);bind(document.getElementById('right'),1);
setInterval(send,40);function neutral(){steer=0;buttonSteer=0;send();}window.addEventListener('pagehide',neutral);window.addEventListener('blur',neutral);document.addEventListener('visibilitychange',()=>{if(document.hidden)neutral();});
})();
</script></body></html>
